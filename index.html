<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>SCAREE – Co-op Horror</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- AUTH -->
<section id="auth" class="screen d-none">
  <div class="card panel p-4">
    <h1 class="title text-center">SCAREE</h1>
    <p class="text-center text-secondary small">Don't go in alone. Up to 4 survivors.</p>
    <input id="nick" class="form-control mb-2" placeholder="Nickname (for sign up)" maxlength="16">
    <input id="email" type="email" class="form-control mb-2" placeholder="Email" autocomplete="email">
    <input id="pass" type="password" class="form-control mb-3" placeholder="Password (6+ chars)" autocomplete="current-password">
    <div class="d-grid gap-2">
      <button id="btnLogin" class="btn btn-danger">Log in</button>
      <button id="btnReg" class="btn btn-outline-danger">Create account</button>
      <button id="btnGoogle" class="btn btn-outline-light">Continue with Google</button>
    </div>
    <div id="authErr" class="text-danger small mt-2 text-center"></div>
  </div>
</section>
<!-- MENU -->
<section id="menu" class="screen d-none">
  <div class="card panel p-4">
    <h2 class="title text-center">The Asylum</h2>
    <p class="text-center small text-secondary mb-3">Survivor: <b id="who"></b><br>Deepest level reached: <b id="best">0</b>/3</p>
    <button id="btnCreate" class="btn btn-danger mb-3">Create room</button>
    <div class="input-group mb-2">
      <input id="joinCode" class="form-control text-uppercase" placeholder="Room code" maxlength="5">
      <button id="btnJoin" class="btn btn-outline-danger">Join</button>
    </div>
    <div id="menuErr" class="text-danger small text-center"></div>
    <button id="btnOut" class="btn btn-sm btn-link text-secondary mt-2">Log out</button>
  </div>
</section>
<!-- LOBBY -->
<section id="lobby" class="screen d-none">
  <div class="card panel p-4">
    <h2 class="title text-center">Room <span id="lobCode"></span></h2>
    <p class="text-center small text-secondary">Share this code. Max 4 players.</p>
    <ul id="lobPlayers" class="list-group mb-3"></ul>
    <select id="startLvl" class="form-select mb-2 d-none"></select>
    <button id="btnStart" class="btn btn-danger d-none">Enter the Asylum</button>
    <div id="lobWait" class="text-center text-secondary small">Waiting for host to start…</div>
    <button id="btnLeave" class="btn btn-sm btn-link text-secondary mt-2">Leave</button>
  </div>
</section>
<!-- GAME -->
<section id="game" class="d-none">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="hudTop"><span id="hudKeys"></span><span id="hudHp"></span><span id="hudRoom"></span></div>
    <div id="hudMsg"></div><div id="prompt"></div><div id="story"></div>
  </div>
  <div id="joy"><div id="knob"></div></div>
  <button id="btnLight" class="ctl">🔦</button>
  <button id="btnRun" class="ctl">🏃</button><button id="btnAtk" class="ctl">⚔</button><button id="btnUse" class="ctl">✋</button><button id="btnFlare" class="ctl">🕯</button>
</section>
<div id="note" class="d-none"></div>
<div id="endOverlay" class="d-none">
  <div class="text-center"><h1 id="endTitle" class="title"></h1><p id="endText"></p>
  <button id="btnBack" class="btn btn-danger d-none">Back to lobby</button>
  <button id="btnQuit" class="btn btn-outline-light">Leave</button></div>
</div>
<img id="ghost" alt="">
<div id="flash"></div>
<div id="grain"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="js/main.js?v=4"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'))</script>
</body>
</html>
